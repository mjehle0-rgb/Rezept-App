<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rezept App</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Modernes UX Styling für die Filterleiste */
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
        .ios-momentum { -webkit-overflow-scrolling: touch; }
        body { background-color: #f9fafb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="text-gray-900 antialiased pb-12">

    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-gray-100 px-4 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-gray-800 tracking-tight">Rezept App 👨‍🍳</h1>
        <button onclick="openRecipeModal()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-sm transition-all flex items-center gap-1">
            <span>+ Neu</span>
        </button>
    </header>

    <main class="max-w-md mx-auto pt-4">
        
        <div class="px-4 mb-2">
            <div class="relative">
                <input type="text" id="search-input" oninput="handleSearchOrFilterChange()" placeholder="Rezepte, Zutaten oder Notizen suchen..." 
                       class="w-full bg-white border border-gray-200 rounded-2xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all shadow-xs">
                <div class="absolute left-3 top-3.5 text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                </div>
            </div>
        </div>

        <div id="filter-container" class="flex overflow-x-auto py-2 px-4 gap-2 scrollbar-none snap-x ios-momentum sticky top-[69px] bg-[#f9fafb] z-30">
            </div>

        <div class="px-4 mt-2">
            <div id="recipes-container" class="grid grid-cols-1 gap-4">
                <div class="text-center py-12 text-gray-400">Rezepte werden geladen...</div>
            </div>
        </div>

    </main>

    <script src="/src/app.js" type="module"></script>
</body>
</html>
