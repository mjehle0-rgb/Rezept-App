<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GourmetBox">
    <meta name="theme-color" content="#FBFBFA">
    
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2921/2921822.png">
    
    <title>GourmetBox – Culinary Studio</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .font-serif { font-family: 'Playfair Display', serif; }
        
        /* Smooth Mobile Overlay */
        @media (max-width: 1024px) {
            #formContainer {
                position: fixed;
                inset: 0;
                z-index: 50;
                transform: translateY(100%);
                transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            }
            #formContainer.open {
                transform: translateY(0);
            }
        }
        
        /* Hide scrollbar but keep functionality */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#FBFBFA] min-h-screen text-gray-800 antialiased overflow-x-hidden">

    <button id="mobileAddBtn" class="lg:hidden fixed bottom-8 right-6 z-[60] bg-gray-900 text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center text-2xl transition-transform active:scale-95">
        <span id="btnIcon">＋</span>
    </button>

    <div class="max-w-6xl mx-auto px-4 py-8 lg:py-12">
        
        <header class="flex justify-between items-center mb-10 lg:mb-16">
            <div>
                <h1 class="text-3xl lg:text-4xl font-bold font-serif text-gray-900 tracking-tight">
                    GourmetBox <span class="text-lg italic text-amber-600 font-normal ml-1">Studio</span>
                </h1>
                <p class="text-[11px] uppercase tracking-[0.2em] text-gray-400 mt-1 font-semibold">Digital Recipe Collection</p>
            </div>
            <div class="hidden sm:flex bg-white border border-gray-100 shadow-sm px-3 py-1.5 rounded-full items-center gap-2">
                <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
                <span class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Sync Active</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-start">
            
            <div id="formContainer" class="lg:col-span-5 bg-[#FBFBFA] lg:bg-transparent overflow-y-auto no-scrollbar lg:overflow-visible">
                <div class="h-full lg:h-auto bg-white lg:bg-white p-6 lg:p-8 rounded-t-[2.5rem] lg:rounded-3xl shadow-2xl lg:shadow-sm border-t lg:border border-gray-100 relative">
                    
                    <div class="lg:hidden flex justify-center mb-6">
                        <div class="w-12 h-1.5 bg-gray-200 rounded-full" id="closeHandle"></div>
                    </div>

                    <div class="mb-8 flex justify-between items-center">
                        <h2 class="text-xl font-bold font-serif text-gray-900 italic">Neues Rezept kreieren</h2>
                        <button id="closeFormBtn" class="lg:hidden text-gray-400 text-sm font-bold uppercase tracking-widest">Schließen</button>
                    </div>

                    <form id="recipeForm" class="space-y-6">
                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Link importieren</label>
                            <div class="flex gap-2 p-1.5 bg-gray-50 border border-gray-100 rounded-2xl focus-within:ring-2 focus-within:ring-amber-500/20 focus-within:border-amber-500 transition-all">
                                <input type="url" id="recipeLink" placeholder="Instagram, Blog, Chefkoch..." 
                                       class="flex-1 bg-transparent px-3 py-2 text-sm focus:outline-none">
                                <button type="button" id="magicBtn" class="bg-amber-600 text-white font-bold px-4 py-2 rounded-xl transition-all shadow-md flex items-center justify-center cursor-pointer text-xs">
                                    🪄 MAGIC
                                </button>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 gap-5">
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Gericht Name</label>
                                <input type="text" id="recipeTitle" required placeholder="z.B. Trüffel-Pasta" 
                                       class="w-full bg-gray-50 border border-gray-100 rounded-2xl px-4 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all">
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Kategorien</label>
                                <input type="text" id="recipeTags" placeholder="Pasta, Dinner, 15min" 
                                       class="w-full bg-gray-50 border border-gray-100 rounded-2xl px-4 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all">
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Zutaten & Notizen</label>
                            <textarea id="recipeNotes" rows="6" placeholder="Was macht dieses Rezept besonders?" 
                                      class="w-full bg-gray-50 border border-gray-100 rounded-2xl px-4 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all leading-relaxed no-scrollbar"></textarea>
                        </div>

                        <button type="submit" class="w-full bg-gray-900 text-white font-bold py-4 rounded-2xl transition-all shadow-lg hover:bg-amber-600 active:scale-[0.98] cursor-pointer text-sm tracking-widest">
                            STUDIO SPEICHERN
                        </button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-7">
                <div class="flex items-baseline justify-between mb-8">
                    <h2 class="text-2xl font-bold font-serif text-gray-900 italic">Sammlung</h2>
                    <span id="recipeCount" class="text-[10px] font-black text-amber-600 bg-amber-50 px-2.5 py-1 rounded-full uppercase">0 Rezepte</span>
                </div>
                
                <div id="recipeList" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    </div>
            </div>

        </div>
    </div>

    <script>
        const formContainer = document.getElementById('formContainer');
        const mobileAddBtn = document.getElementById('mobileAddBtn');
        const closeFormBtn = document.getElementById('closeFormBtn');
        const btnIcon = document.getElementById('btnIcon');
        const recipeForm = document.getElementById('recipeForm');
        const recipeList = document.getElementById('recipeList');
        const recipeCount = document.getElementById('recipeCount');

        // Toggle Logic für Mobile
        function toggleForm() {
            const isOpen = formContainer.classList.toggle('open');
            btnIcon.textContent = isOpen ? '✕' : '＋';
            mobileAddBtn.classList.toggle('bg-red-500', isOpen);
            mobileAddBtn.classList.toggle('bg-gray-900', !isOpen);
            document.body.style.overflow = isOpen ? 'hidden' : 'auto';
        }

        mobileAddBtn.addEventListener('click', toggleForm);
        closeFormBtn.addEventListener('click', toggleForm);

        // Supabase-Daten laden
        async function loadRecipes() {
            try {
                const response = await fetch('/api/get-recipes');
                const recipes = await response.json();
                recipeList.innerHTML = "";
                recipeCount.textContent = `${recipes.length} Rezepte`;

                if (!recipes || recipes.length === 0) {
                    recipeList.innerHTML = `<div class='col-span-full py-20 text-center'><p class='font-serif italic text-gray-400'>Noch keine Schätze gespeichert.</p></div>`;
                    return;
                }

                recipes.forEach(recipe => {
                    const tags = Array.isArray(recipe.tags) ? recipe.tags : (recipe.tags ? recipe.tags.split(',') : []);
                    const card = document.createElement('div');
                    card.className = "bg-white p-6 rounded-[2rem] shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-gray-100 flex flex-col justify-between hover:shadow-xl transition-all duration-500 group";
                    card.innerHTML = `
                        <div>
                            <h3 class="font-bold font-serif text-gray-900 text-xl leading-tight group-hover:text-amber-600 transition-colors">${recipe.title}</h3>
                            <div class="flex flex-wrap gap-2 mt-3">
                                ${tags.map(t => `<span class="text-[9px] font-black uppercase tracking-widest text-amber-700 bg-amber-50 px-2 py-0.5 rounded-md">${t.trim()}</span>`).join('')}
                            </div>
                            <p class="text-gray-500 text-xs mt-5 leading-relaxed italic border-l-2 border-amber-100 pl-3">${recipe.notes || ''}</p>
                        </div>
                        <div class="mt-8 pt-4 border-t border-gray-50 flex justify-between items-center text-[10px] font-bold uppercase tracking-widest">
                            ${recipe.link ? `<a href="${recipe.link}" target="_blank" class="text-gray-400 hover:text-amber-600 transition-colors">Link ↗</a>` : '<span></span>'}
                            <button onclick="deleteRecipe(${recipe.id})" class="text-gray-200 hover:text-red-500 transition-colors cursor-pointer">Löschen</button>
                        </div>
                    `;
                    recipeList.appendChild(card);
                });
            } catch (e) { console.error(e); }
        }

        // Magic Button (Gemini KI)
        magicBtn.addEventListener('click', async () => {
            const link = document.getElementById('recipeLink').value.trim();
            if (!link) return alert('Link einfügen!');
            
            magicBtn.textContent = "⏳...";
            magicBtn.disabled = true;
            
            try {
                const response = await fetch('/api/fetch-recipe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: link })
                });
                const data = await response.json();
                if (data.title) document.getElementById('recipeTitle').value = data.title;
                if (data.tags) document.getElementById('recipeTags').value = data.tags;
                if (data.notes) document.getElementById('recipeNotes').value = data.notes;
            } catch (e) { alert("KI-Timeout. Bitte noch mal probieren."); }
            finally {
                magicBtn.textContent = "🪄 MAGIC";
                magicBtn.disabled = false;
            }
        });

        // Rezept Speichern
        recipeForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                title: document.getElementById('recipeTitle').value,
                link: document.getElementById('recipeLink').value,
                tags: document.getElementById('recipeTags').value,
                notes: document.getElementById('recipeNotes').value
            };
            
            const response = await fetch('/api/save-recipe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                recipeForm.reset();
                if (window.innerWidth < 1024) toggleForm(); // Automatisch schließen auf Mobile
                loadRecipes();
            }
        });

        // Löschen
        window.deleteRecipe = async function(id) {
            if (!confirm("Rezept löschen?")) return;
            await fetch('/api/get-recipes', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });
            loadRecipes();
        }

        loadRecipes();

        // PWA Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:text/javascript;base64,c2VsZi5hZGRFdmVudExpc3RlbmVyKCdmZXRjaCcsIGZ1bmN0aW9uKGV2ZW50KSB7fSk7', { scope: '/' });
        }
    </script>
</body>
</html>
