<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Rezept Sammler</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f59e0b">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pb-12">

    <header class="bg-amber-500 text-white shadow-md p-4 sticky top-0 z-10">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">🧑‍🍳 Rezept-Sammler</h1>
            <span class="text-xs bg-amber-600 px-2 py-1 rounded-full uppercase tracking-wider font-semibold">MVP 1.2</span>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 mt-6">
        
        <section class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-6">
            <h2 class="text-lg font-semibold mb-3">Neues Rezept merken</h2>
            <div class="space-y-3">
                
                <div class="flex gap-2">
                    <input type="url" id="recipeLink" placeholder="Link (Instagram, TikTok, YouTube...)" 
                           class="flex-1 p-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
                    <button id="magicBtn" type="button" title="Zutaten automatisch per KI auslesen"
                            class="bg-purple-600 hover:bg-purple-700 text-white px-4 rounded-xl transition flex items-center justify-center cursor-pointer">
                        🪄 <span class="hidden sm:inline ml-1 text-sm font-medium">Magic</span>
                    </button>
                </div>

                <input type="text" id="recipeTitle" placeholder="Name des Rezepts (z.B. Feta Pasta)" 
                       class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
                
                <input type="text" id="recipeTags" placeholder="Tags mit Komma trennen (z.B. Pasta, Schnell)" 
                       class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
                
                <textarea id="recipeNotes" rows="3" placeholder="Zutaten & Notizen (wird vom Magic-Button automatisch ausgefüllt...)" 
                          class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm font-mono"></textarea>
                
                <button id="addBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-medium p-3 rounded-xl transition duration-200 cursor-pointer text-sm">
                    Rezept Speichern
                </button>
            </div>
        </section>

        <section class="mb-4">
            <div class="flex gap-2 overflow-x-auto pb-2" id="filterContainer"></div>
        </section>

        <section>
            <h2 class="text-lg font-semibold mb-3">Deine Sammlung</h2>
            <div id="recipeList" class="space-y-3"></div>
        </section>

    </main>

    <script>
        const recipeTitle = document.getElementById('recipeTitle');
        const recipeLink = document.getElementById('recipeLink');
        const recipeTags = document.getElementById('recipeTags');
        const recipeNotes = document.getElementById('recipeNotes');
        const addBtn = document.getElementById('addBtn');
        const magicBtn = document.getElementById('magicBtn');
        const recipeList = document.getElementById('recipeList');
        const filterContainer = document.getElementById('filterContainer');

        let myRecipes = JSON.parse(localStorage.getItem('socialRecipes')) || [];
        let activeFilter = 'Alle';

     // ERWEITERTE KI-LOGIK MIT DIREKTEM STATUS-FEEDBACK
        magicBtn.addEventListener('click', async () => {
            const link = recipeLink.value.trim();
            if (!link) {
                alert('Bitte füge zuerst einen Social-Media-Link ein!');
                return;
            }

            // Button sperren und Textfeld als internen Log nutzen
            magicBtn.innerHTML = "⏳...";
            magicBtn.disabled = true;
            recipeNotes.value = "Starte Analyse...\nVerbinde mit Server...";

            try {
                const response = await fetch('/api/fetch-recipe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: link })
                });

                recipeNotes.value += "\nAntwort vom Server erhalten. Verarbeite...";

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || `Server-Status: ${response.status}`);
                }

                const data = await response.json();
                recipeNotes.value += "\nJSON erfolgreich parst!";

                if (data.title) recipeTitle.value = data.title;
                if (data.tags) recipeTags.value = data.tags;
                if (data.notes) recipeNotes.value = data.notes;

            } catch (error) {
                console.error("Fehler im JavaScript:", error);
                // Schreibt den exakten Fehler direkt in das große Textfeld, damit wir ihn sehen!
                recipeNotes.value = `❌ FEHLER IM BROWSER:\n${error.message}\n\nHinweis: Wenn im Vercel-Log nichts steht, blockiert dein Browser oder AdBlocker diesen Aufruf komplett.`;
            } finally {
                magicBtn.innerHTML = "🪄 <span class='hidden sm:inline ml-1 text-sm font-medium'>Magic</span>";
                magicBtn.disabled = false;
            }
        });  

        // ==========================================
        // RESTLICHE LOGIK (SPEICHERN, RENDERN, FILTERN)
        // ==========================================
        function renderFilters() {
            let allTags = ['Alle'];
            myRecipes.forEach(recipe => {
                if (recipe.tags) {
                    recipe.tags.forEach(tag => {
                        if (!allTags.includes(tag)) allTags.push(tag);
                    });
                }
            });

            filterContainer.innerHTML = allTags.map(tag => {
                const isActive = tag === activeFilter;
                const btnClass = isActive 
                    ? "bg-amber-500 text-white px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap shadow-sm transition cursor-pointer"
                    : "bg-gray-200 text-gray-700 hover:bg-gray-300 px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition cursor-pointer";
                return `<button onclick="setFilter('${tag}')" class="${btnClass}">${tag === 'Alle' ? 'Alle' : '#' + tag}</button>`;
            }).join('');
        }

        window.setFilter = function(tag) {
            activeFilter = tag;
            renderFilters();
            renderRecipes();
        }

        function renderRecipes() {
            const filteredRecipes = activeFilter === 'Alle' 
                ? myRecipes 
                : myRecipes.filter(recipe => recipe.tags && recipe.tags.includes(activeFilter));

            if (filteredRecipes.length === 0) {
                recipeList.innerHTML = `<div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center py-8 text-gray-400 text-sm">Keine Rezepte gefunden.</div>`;
                return;
            }

            recipeList.innerHTML = '';

            filteredRecipes.forEach((recipe) => {
                const originalIndex = myRecipes.indexOf(recipe);
                const tagsArray = recipe.tags || ['Allgemein'];
                const tagBadges = tagsArray.map(tag => `<span class="bg-gray-100 text-gray-600 text-xs px-2 py-1 rounded-md font-medium">#${tag}</span>`).join(' ');

                let platformEmoji = '🔗';
                if (recipe.link.includes('instagram.com')) platformEmoji = '📸';
                if (recipe.link.includes('tiktok.com')) platformEmoji = '🎵';
                if (recipe.link.includes('youtube.com') || recipe.link.includes('youtu.be')) platformEmoji = '📺';

                const formattedNotes = recipe.notes 
                    ? `<div class="mt-3 pt-3 border-t border-gray-100 text-sm text-gray-600 whitespace-pre-line font-mono bg-gray-50 p-2.5 rounded-xl">${recipe.notes}</div>` 
                    : '';

                const recipeCard = document.createElement('div');
                recipeCard.className = "bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between transition hover:shadow-md";
                recipeCard.innerHTML = `
                    <div class="mb-3">
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <h3 class="font-bold text-gray-900 leading-tight">${recipe.title}</h3>
                            <button onclick="deleteRecipe(${originalIndex})" class="text-gray-300 hover:text-red-500 text-sm transition cursor-pointer">✕</button>
                        </div>
                        <div class="flex flex-wrap gap-1">
                            ${tagBadges}
                        </div>
                        ${formattedNotes}
                    </div>
                    <a href="${recipe.link}" target="_blank" class="inline-flex items-center justify-center gap-2 bg-amber-50 hover:bg-amber-100 text-amber-700 text-sm font-semibold p-2.5 rounded-xl transition">
                        ${platformEmoji} Video öffnen
                    </a>
                `;
                recipeList.appendChild(recipeCard);
            });
        }

        addBtn.addEventListener('click', () => {
            const title = recipeTitle.value.trim();
            const link = recipeLink.value.trim();
            const tagsInput = recipeTags.value.trim();
            const notes = recipeNotes.value.trim();

            if (!title || !link) {
                alert('Bitte gib mindestens einen Namen und einen Link ein!');
                return;
            }

            const tags = tagsInput ? tagsInput.split(',').map(t => t.trim()).filter(t => t !== '') : ['Allgemein'];
            const newRecipe = { title, link, tags, notes };

            myRecipes.unshift(newRecipe);
            localStorage.setItem('socialRecipes', JSON.stringify(myRecipes));

            recipeTitle.value = '';
            recipeLink.value = '';
            recipeTags.value = '';
            recipeNotes.value = '';

            activeFilter = 'Alle';
            renderFilters();
            renderRecipes();
        });

        window.deleteRecipe = function(index) {
            if (confirm('Möchtest du dieses Rezept wirklich löschen?')) {
                myRecipes.splice(index, 1);
                localStorage.setItem('socialRecipes', JSON.stringify(myRecipes));
                renderFilters();
                if (!filterContainer.innerHTML.includes(activeFilter)) activeFilter = 'Alle';
                renderFilters();
                renderRecipes();
            }
        }

        renderFilters();
        renderRecipes();
    </script>
</body>
</html>
