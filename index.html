<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Rezept-Sammlung</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <div class="max-w-4xl mx-auto px-4 py-8">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">🧑‍🍳 Rezept-Sammler</h1>
            <span class="bg-green-100 text-green-800 text-xs font-semibold px-3 py-1 rounded-full flex items-center gap-1">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> Cloud Aktiv
            </span>
        </header>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-8">
            <form id="recipeForm" class="space-y-4">
                <div class="flex gap-2">
                    <input type="url" id="recipeLink" placeholder="Social-Media- oder Blog-Link einfügen..." 
                           class="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:bg-white transition">
                    <button type="button" id="magicBtn" class="bg-purple-600 hover:bg-purple-700 text-white font-medium px-5 py-3 rounded-xl transition flex items-center justify-center cursor-pointer">
                        🪄 <span class="hidden sm:inline ml-1 text-sm font-medium">Magic</span>
                    </button>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Name des Gerichts</label>
                        <input type="text" id="recipeTitle" required placeholder="z.B. Schnelle Feta-Pasta" 
                               class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:bg-white transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Tags (Komma-getrennt)</label>
                        <input type="text" id="recipeTags" placeholder="z.B. Pasta, Schnell, Veggie" 
                               class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:bg-white transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Zutaten & Notizen</label>
                    <textarea id="recipeNotes" rows="4" placeholder="• 250g Pasta&#10;• 1 Block Feta..." 
                              class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:bg-white transition"></textarea>
                </div>

                <button type="submit" class="w-full bg-gray-900 hover:bg-gray-800 text-white font-medium py-3 rounded-xl transition cursor-pointer">
                    Speichern & in Cloud sichern
                </button>
            </form>
        </div>

        <h2 class="text-xl font-bold text-gray-800 mb-4">Meine Rezepte</h2>
        <div id="recipeList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            </div>
    </div>

    <script>
        const recipeForm = document.getElementById('recipeForm');
        const recipeLink = document.getElementById('recipeLink');
        const magicBtn = document.getElementById('magicBtn');
        const recipeTitle = document.getElementById('recipeTitle');
        const recipeTags = document.getElementById('recipeTags');
        const recipeNotes = document.getElementById('recipeNotes');
        const recipeList = document.getElementById('recipeList');

        // 1. Rezepte beim Start aus Supabase laden
        async function loadRecipes() {
            recipeList.innerHTML = "<div class='col-span-full text-center py-8'><p class='text-gray-400 text-sm animate-pulse'>Lade Rezepte aus der Cloud...</p></div>";
            try {
                const response = await fetch('/api/get-recipes');
                const recipes = await response.json();

                recipeList.innerHTML = "";
                if (!recipes || recipes.length === 0) {
                    recipeList.innerHTML = "<div class='col-span-full text-center py-8'><p class='text-gray-400 text-sm'>Noch keine Rezepte in deiner Cloud-Datenbank.</p></div>";
                    return;
                }

                recipes.forEach(recipe => {
                    const tagsText = Array.isArray(recipe.tags) ? recipe.tags.join(', ') : recipe.tags;
                    
                    const card = document.createElement('div');
                    card.className = "bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between transition hover:shadow-md";
                    card.innerHTML = `
                        <div>
                            <h3 class="font-bold text-gray-800 text-lg leading-snug">${recipe.title}</h3>
                            <span class="text-xs font-semibold text-purple-600 bg-purple-50 px-2.5 py-1 rounded-lg inline-block mt-2">${tagsText || 'Allgemein'}</span>
                            <p class="text-gray-600 text-sm mt-4 whitespace-pre-line leading-relaxed">${recipe.notes || ''}</p>
                        </div>
                        <div class="mt-6 pt-4 border-t border-gray-50 flex justify-between items-center text-xs">
                            ${recipe.link ? `<a href="${recipe.link}" target="_blank" class="text-blue-500 hover:text-blue-600 font-medium flex items-center gap-1">Original Link ↗</a>` : '<span></span>'}
                            <button onclick="deleteRecipe(${recipe.id})" class="text-gray-400 hover:text-red-500 transition cursor-pointer text-base">🗑️</button>
                        </div>
                    `;
                    recipeList.appendChild(card);
                });
            } catch (error) {
                recipeList.innerHTML = `<div class='col-span-full text-center py-8'><p class='text-red-500 text-sm'>Fehler beim Laden: ${error.message}</p></div>`;
            }
        }

        // 2. KI "Magic"-Button Logik
        magicBtn.addEventListener('click', async () => {
            const link = recipeLink.value.trim();
            if (!link) {
                alert('Bitte füge zuerst einen Social-Media- oder Blog-Link ein!');
                return;
            }

            magicBtn.innerHTML = "⏳";
            magicBtn.disabled = true;
            recipeNotes.value = "KI analysiert Webseite und filtert Müll heraus...";

            try {
                const response = await fetch('/api/fetch-recipe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: link })
                });

                if (!response.ok) throw new Error(`Server antwortet nicht (${response.status})`);

                const data = await response.json();

                if (data.title) recipeTitle.value = data.title;
                if (data.tags) recipeTags.value = data.tags;
                if (data.notes) recipeNotes.value = data.notes;

            } catch (error) {
                console.error(error);
                recipeNotes.value = `❌ Fehler bei der Verarbeitung:\n${error.message}`;
            } finally {
                magicBtn.innerHTML = "🪄 <span class='hidden sm:inline ml-1 text-sm font-medium'>Magic</span>";
                magicBtn.disabled = false;
            }
        });

        // 3. Rezept in die Cloud speichern
        recipeForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const newRecipe = {
                title: recipeTitle.value.trim(),
                link: recipeLink.value.trim(),
                tags: recipeTags.value.trim(),
                notes: recipeNotes.value.trim()
            };

            if (!newRecipe.title) return;

            try {
                const response = await fetch('/api/save-recipe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newRecipe)
                });

                if (response.ok) {
                    recipeForm.reset();
                    loadRecipes();
                } else {
                    alert("Fehler beim Speichern in der Cloud-Datenbank.");
                }
            } catch (error) {
                console.error(error);
                alert("Verbindungsfehler zur Datenbank.");
            }
        });

        // 4. Rezept aus der Cloud löschen
        window.deleteRecipe = async function(id) {
            if (!confirm("Rezept wirklich unwiderruflich aus der Cloud löschen?")) return;

            try {
                const response = await fetch('/api/get-recipes', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id })
                });

                if (response.ok) {
                    loadRecipes();
                } else {
                    alert("Fehler beim Löschen auf dem Server.");
                }
            } catch (error) {
                console.error(error);
            }
        }

        // Beim ersten Laden direkt die Cloud-Daten abrufen
        loadRecipes();
    </script>
</body>
</html>
