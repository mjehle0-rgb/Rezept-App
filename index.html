<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Rezept Sammler</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f59e0b">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pb-12">

    <header class="bg-amber-500 text-white shadow-md p-4 sticky top-0 z-10">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">🧑‍🍳 Rezept-Sammler</h1>
            <span class="text-xs bg-amber-600 px-2 py-1 rounded-full uppercase tracking-wider font-semibold">MVP 1.1</span>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 mt-6">
        
        <section class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-6">
            <h2 class="text-lg font-semibold mb-3">Neues Rezept merken</h2>
            <div class="space-y-3">
                <input type="text" id="recipeTitle" placeholder="Name des Rezepts (z.B. Feta Pasta)" 
                       class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
                
                <input type="url" id="recipeLink" placeholder="Link (Instagram, TikTok, YouTube...)" 
                       class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
                
                <input type="text" id="recipeTags" placeholder="Tags mit Komma trennen (z.B. Pasta, Schnell)" 
                       class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
                
                <button id="addBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-medium p-3 rounded-xl transition duration-200 cursor-pointer">
                    Speichern
                </button>
            </div>
        </section>

        <section class="mb-4">
            <div class="flex gap-2 overflow-x-auto pb-2" id="filterContainer">
                </div>
        </section>

        <section>
            <h2 class="text-lg font-semibold mb-3">Deine Sammlung</h2>
            <div id="recipeList" class="space-y-3">
                </div>
        </section>

    </main>

    <script>
        // 1. Elemente aus dem HTML abgreifen
        const recipeTitle = document.getElementById('recipeTitle');
        const recipeLink = document.getElementById('recipeLink');
        const recipeTags = document.getElementById('recipeTags');
        const addBtn = document.getElementById('addBtn');
        const recipeList = document.getElementById('recipeList');
        const filterContainer = document.getElementById('filterContainer');

        // 2. Zustand der App (Daten & aktiver Filter)
        let myRecipes = JSON.parse(localStorage.getItem('socialRecipes')) || [];
        let activeFilter = 'Alle';

        // 3. Funktion zum Generieren der Filter-Buttons
        function renderFilters() {
            let allTags = ['Alle'];
            
            // Alle einzigartigen Tags aus allen Rezepten sammeln
            myRecipes.forEach(recipe => {
                recipe.tags.forEach(tag => {
                    if (!allTags.includes(tag)) {
                        allTags.push(tag);
                    }
                });
            });

            // HTML für die Filter-Leiste aufbauen
            filterContainer.innerHTML = allTags.map(tag => {
                const isActive = tag === activeFilter;
                const btnClass = isActive 
                    ? "bg-amber-500 text-white px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap shadow-sm transition cursor-pointer"
                    : "bg-gray-200 text-gray-700 hover:bg-gray-300 px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition cursor-pointer";
                
                return `<button onclick="setFilter('${tag}')" class="${btnClass}">${tag === 'Alle' ? 'Alle' : '#' + tag}</button>`;
            }).join('');
        }

        // 4. Funktion zum Setzen des aktiven Filters
        window.setFilter = function(tag) {
            activeFilter = tag;
            renderFilters();
            renderRecipes();
        }

        // 5. Funktion: Rezepte auf dem Bildschirm anzeigen
        function renderRecipes() {
            // Rezepte filtern, falls ein Tag ausgewählt ist
            const filteredRecipes = activeFilter === 'Alle' 
                ? myRecipes 
                : myRecipes.filter(recipe => recipe.tags.includes(activeFilter));

            // Wenn keine Rezepte da sind
            if (filteredRecipes.length === 0) {
                if (myRecipes.length === 0) {
                    recipeList.innerHTML = `
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center py-8 text-gray-400">
                            Noch keine Rezepte gespeichert. Füge oben dein erstes hinzu!
                        </div>`;
                } else {
                    recipeList.innerHTML = `
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center py-8 text-gray-400">
                            Keine Rezepte mit dem Tag #${activeFilter} gefunden.
                        </div>`;
                }
                return;
            }

            recipeList.innerHTML = '';

            // Rezepte rendern
            filteredRecipes.forEach((recipe) => {
                const originalIndex = myRecipes.indexOf(recipe);

                const tagBadges = recipe.tags
                    .map(tag => `<span class="bg-gray-100 text-gray-600 text-xs px-2 py-1 rounded-md font-medium">#${tag}</span>`)
                    .join(' ');

                // Plattform-Erkennung für passende Emojis
                let platformEmoji = '🔗';
                if (recipe.link.includes('instagram.com')) platformEmoji = '📸';
                if (recipe.link.includes('tiktok.com')) platformEmoji = '🎵';
                if (recipe.link.includes('youtube.com') || recipe.link.includes('youtu.be')) platformEmoji = '📺';

                const recipeCard = document.createElement('div');
                recipeCard.className = "bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between transition hover:shadow-md";
                recipeCard.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <h3 class="font-bold text-gray-900 leading-tight">${recipe.title}</h3>
                            <button onclick="deleteRecipe(${originalIndex})" class="text-gray-300 hover:text-red-500 text-sm transition cursor-pointer">✕</button>
                        </div>
                        <div class="flex flex-wrap gap-1 mb-4">
                            ${tagBadges}
                        </div>
                    </div>
                    <a href="${recipe.link}" target="_blank" class="inline-flex items-center justify-center gap-2 bg-amber-50 hover:bg-amber-100 text-amber-700 text-sm font-semibold p-2.5 rounded-xl transition">
                        ${platformEmoji} Video öffnen
                    </a>
                `;
                recipeList.appendChild(recipeCard);
            });
        }

        // 6. Funktion: Neues Rezept hinzufügen
        addBtn.addEventListener('click', () => {
            const title = recipeTitle.value.trim();
            const link = recipeLink.value.trim();
            const tagsInput = recipeTags.value.trim();

            if (!title || !link) {
                alert('Bitte gib mindestens einen Namen und einen Link ein!');
                return;
            }

            // Tags verarbeiten und säubern
            const tags = tagsInput 
                ? tagsInput.split(',').map(t => t.trim()).filter(t => t !== '') 
                : ['Allgemein'];

            const newRecipe = { title, link, tags };

            myRecipes.unshift(newRecipe);
            localStorage.setItem('socialRecipes', JSON.stringify(myRecipes));

            // Formular zurücksetzen
            recipeTitle.value = '';
            recipeLink.value = '';
            recipeTags.value = '';

            // Filter zurücksetzen, damit das neue Rezept sichtbar ist
            activeFilter = 'Alle';

            // Ansicht aktualisieren
            renderFilters();
            renderRecipes();
        });

        // 7. Funktion: Rezept löschen
        window.deleteRecipe = function(index) {
            if (confirm('Möchtest du dieses Rezept wirklich löschen?')) {
                myRecipes.splice(index, 1);
                localStorage.setItem('socialRecipes', JSON.stringify(myRecipes));
                
                // Prüfen, ob der aktive Filter-Tag überhaupt noch existiert
                renderFilters();
                const filterExists = filterContainer.innerHTML.includes(activeFilter);
                if (!filterExists) activeFilter = 'Alle';
                
                renderFilters();
                renderRecipes();
            }
        }

        // Initialer Start beim Laden der Seite
        renderFilters();
        renderRecipes();
    </script>
</body>
</html>
